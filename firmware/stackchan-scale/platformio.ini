; Stack-chan (M5Stack CoreS3) + Unit Mini Scales -> HealthTrack Food Log
; Build:  pio run          Flash:  pio run -t upload          Logs:  pio device monitor

[env:cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; CoreS3 has 8MB QSPI PSRAM; a 640x480 RGB565 frame is 600KB, so it must live there
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=2

lib_deps =
    m5stack/M5Unified@^0.2.11
    bblanchon/ArduinoJson@^7.2.0
    https://github.com/m5stack/M5Unit-Miniscale.git
